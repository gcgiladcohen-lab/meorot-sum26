const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));return new TextDecoder().decode(pt);}
async function go(pw,remember){try{const h=await open(pw);if(remember){try{sessionStorage.setItem('vpw',pw)}catch(e){}}document.open();document.write(h);document.close();}catch(e){document.getElementById('e').textContent='הסיסמה לא נכונה. נסה שוב.';}}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go(document.getElementById('pw').value,true);});
try{const s=sessionStorage.getItem('vpw');if(s)go(s,false);}catch(e){}</script></body></html>
